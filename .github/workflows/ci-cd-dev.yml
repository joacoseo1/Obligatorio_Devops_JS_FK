name: CI/CD - Dev

on:
    push:
        branches:
            - dev
            - PipelineDEV
    pull_request:
        branches:
            - dev

jobs:
    build:
      name: Build
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build api-gateway image
          run: |
            docker build -t api-gateway:ci ./api-gateway

        - name: Build product-service image
          run: |
            docker build -t product-service:ci ./product-service

        - name: Build inventory-service image
          run: |
            docker build -t inventory-service:ci ./inventory-service