name: Terraform Deploy + Build & Deploy

on:
    push:
        branches:
            - dev
            - PipelineDEV
    workflow_dispatch:

env:
    TF_WORKING_DIR: ./IAC
    TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
    TF_STATE_DDB_TABLE: ${{ secrets.TF_STATE_DDB_TABLE }}

jobs:
    terraform-init-apply:
        name: Terraform Init & Apply (create infra)
        runs-on: ubuntu-latest
        outputs:
            applied: ${{ steps.apply.outputs.applied }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # only if temporales; ok si está vacío
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Ensure S3 backend (bucket + DynamoDB lock table)
              if: env.TF_STATE_BUCKET != ''
              run: |
                  set -euo pipefail
                  REGION="${{ secrets.AWS_REGION }}"
                  BUCKET="${{ env.TF_STATE_BUCKET }}"
                  DDB="${{ env.TF_STATE_DDB_TABLE }}"
                  # Create bucket if not exists
                  if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
                    if [ "$REGION" = "us-east-1" ]; then
                      aws s3api create-bucket --bucket "$BUCKET"
                    else
                      aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$REGION"
                    fi
                  fi
                  # Enable versioning and encryption
                  aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
                  aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
                  # Create DynamoDB table for state locking (optional)
                  if [ -n "$DDB" ]; then
                    if ! aws dynamodb describe-table --table-name "$DDB" >/dev/null 2>&1; then
                      aws dynamodb create-table \
                        --table-name "$DDB" \
                        --attribute-definitions AttributeName=LockID,AttributeType=S \
                        --key-schema AttributeName=LockID,KeyType=HASH \
                        --billing-mode PAY_PER_REQUEST
                      aws dynamodb wait table-exists --table-name "$DDB"
                    fi
                  fi

            - name: Terraform Init (remote state)
              if: env.TF_STATE_BUCKET != ''
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: |
                  : "${TF_STATE_KEY:=dev/terraform.tfstate}"
                  terraform init -input=false \
                    -backend-config="bucket=${TF_STATE_BUCKET}" \
                    -backend-config="key=${TF_STATE_KEY}" \
                    -backend-config="region=${{ secrets.AWS_REGION }}" \
                    -backend-config="dynamodb_table=${TF_STATE_DDB_TABLE}"

            - name: Terraform Init (local state fallback)
              if: env.TF_STATE_BUCKET == ''
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform init -input=false

            - name: Terraform Plan (create infra)
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform plan -out=tfplan -input=false

            - name: Terraform Apply (create infra)
              id: apply
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: |
                  terraform apply -auto-approve tfplan
              continue-on-error: false

    build-and-push:
        name: Build images & Push to ECR
        needs: terraform-init-apply
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v1

            - name: Set IMAGE_TAG
              id: vars
              run: echo "TAG=dev-${GITHUB_SHA::8}" >> $GITHUB_ENV

            - name: Test ECR login
              run: |
                aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
                  docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            - name: Build & Push api-gateway
              run: |
                  IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_API_GATEWAY }}"
                  docker build -t api-gateway:${{ env.TAG }} ./api-gateway
                  docker tag api-gateway:${{ env.TAG }} $IMAGE:${{ env.TAG }}
                  docker push $IMAGE:${{ env.TAG }}

            - name: Build & Push product-service
              run: |
                  IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_PRODUCT }}"
                  docker build -t product-service:${{ env.TAG }} ./product-service
                  docker tag product-service:${{ env.TAG }} $IMAGE:${{ env.TAG }}
                  docker push $IMAGE:${{ env.TAG }}

            - name: Build & Push inventory-service
              run: |
                  IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_INVENTORY }}"
                  docker build -t inventory-service:${{ env.TAG }} ./inventory-service
                  docker tag inventory-service:${{ env.TAG }} $IMAGE:${{ env.TAG }}
                  docker push $IMAGE:${{ env.TAG }}

    terraform-update-taskdef:
        name: Terraform Apply (update images & deploy)
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Terraform Init (remote state)
              if: env.TF_STATE_BUCKET != ''
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: |
                  : "${TF_STATE_KEY:=dev/terraform.tfstate}"
                  terraform init -input=false \
                    -backend-config="bucket=${TF_STATE_BUCKET}" \
                    -backend-config="key=${TF_STATE_KEY}" \
                    -backend-config="region=${{ secrets.AWS_REGION }}" \
                    -backend-config="dynamodb_table=${TF_STATE_DDB_TABLE}"

            - name: Terraform Init (local state fallback)
              if: env.TF_STATE_BUCKET == ''
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform init -input=false

            - name: Terraform Plan (update image tags)
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: |
                  terraform plan -out=tfplan -input=false \
                    -var="image_tag_api=${{ env.TAG }}" \
                    -var="image_tag_product=${{ env.TAG }}" \
                    -var="image_tag_inventory=${{ env.TAG }}"

            - name: Terraform Apply (update images & deploy)
              working-directory: ${{ env.TF_WORKING_DIR }}
              run: terraform apply -auto-approve tfplan
