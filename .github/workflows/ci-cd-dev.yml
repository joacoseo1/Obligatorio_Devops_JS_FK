name: CI/CD - Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPOSITORY }} #REVISAR QUE ES ECR

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (if service in Go)
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Build (example product-service)
        working-directory: ./product-service
        run: |
          go env
          go mod download
          go build -v -o ./bin/product ./...

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-bin
          path: product-service/bin

    test:
      name: Test SonarQube
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v5
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

