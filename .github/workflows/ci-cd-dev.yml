name: CI/CD Dev

on:
  push:
    branches:
      - dev
      - PipelineDEV
  pull_request:
    branches:
      - dev

jobs:
  build-and-push:
    name: Build to ECR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build api-gateway
        run: |
          IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_API_GATEWAY }}"
          docker build -t api-gateway:dev ./api-gateway
          docker tag api-gateway:dev $IMAGE:dev-${GITHUB_SHA}
          docker push $IMAGE:dev-${GITHUB_SHA}

      - name: Build product-service
        run: |
          IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_PRODUCT }}"
          docker build -t product-service:dev ./product-service
          docker tag product-service:dev $IMAGE:dev-${GITHUB_SHA}
          docker push $IMAGE:dev-${GITHUB_SHA}

      - name: Build inventory-service
        run: |
          IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_INVENTORY }}"
          docker build -t inventory-service:dev ./inventory-service
          docker tag inventory-service:dev $IMAGE:dev-${GITHUB_SHA}
          docker push $IMAGE:dev-${GITHUB_SHA}

  deploy-ecs:
    name: Deploy ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ECS
        run: |
          aws ecs update-service \
            --cluster obligatorioDevops-dev-cluster \
            --service obligatorioDevops-dev-service \
            --force-new-deployment
